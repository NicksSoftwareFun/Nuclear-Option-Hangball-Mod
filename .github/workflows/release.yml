name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: zip -r "HangballMkII-${TAG}-src.zip" src
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk 'NR>3 && /^## /{exit} NR>3' CHANGELOG.txt > notes.txt
          gh release create "$TAG" release/HangballMkII.dll "HangballMkII-${TAG}-src.zip" \
            --target "$GITHUB_SHA" --title "Hangball Mk.II ${TAG}" --notes-file notes.txt
