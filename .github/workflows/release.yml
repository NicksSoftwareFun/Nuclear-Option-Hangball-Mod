name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: zip -r "HangballMkII-${GITHUB_REF_NAME}-src.zip" src
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk 'NR>3 && /^## /{exit} NR>3' CHANGELOG.txt > notes.txt
          gh release create "$GITHUB_REF_NAME" release/HangballMkII.dll "HangballMkII-${GITHUB_REF_NAME}-src.zip" \
            --title "Hangball Mk.II ${GITHUB_REF_NAME}" --notes-file notes.txt
